<!doctype html>
<html><head><meta charset="utf-8"><title>Receiving — Layout A</title></head>
<body style="font-family:sans-serif;max-width:560px;margin:32px auto">
<h1>Receiving — Layout A</h1>
<label>Delivery
  <select id="delivery"></select>
</label>
<p id="po"></p>
<label>Received quantity
  <input id="qty" type="number" min="0" placeholder="e.g. 10">
</label><br><br>
<label>Note (max 500 chars)
  <input id="note" type="text" size="40" placeholder="optional handler note">
</label><br><br>
<label>Correction reason (required when changing a saved record)
  <input id="reason" type="text" size="40" placeholder="">
</label><br><br>
<button id="go">Reconcile</button>
<label style="margin-left:12px"><input id="zero" type="checkbox"> confirm zero — nothing arrived</label>
<label style="margin-left:12px"><input id="fail" type="checkbox"> simulate save failure</label>
<pre id="result"></pre>
<h2>Saved records</h2>
<pre id="records"></pre>
<h2>Supervisor queue</h2>
<pre id="queue"></pre>
<script>
const $ = id => document.getElementById(id);
let deliveries = [], pos = [];
async function load() {
  deliveries = await (await fetch('/api/deliveries')).json();
  pos = await (await fetch('/api/purchase-orders')).json();
  $('delivery').innerHTML = deliveries.map(d =>
    `<option value="${d.id}">${d.id} (${d.purchaseOrder})</option>`).join('');
  showPO(); refresh();
}
function showPO() {
  const d = deliveries.find(x => x.id === $('delivery').value);
  const p = pos.find(x => x.id === (d && d.purchaseOrder));
  $('po').textContent = p ? `PO ${p.id}: ${p.item}, ordered ${p.orderedQuantity}` : '';
  if (d && d.receivedQuantity != null) $('qty').value = d.receivedQuantity;
}
$('delivery').onchange = showPO;
$('go').onclick = async () => {
  const qty = $('qty').value === '' ? null : Number($('qty').value);
  const r = await fetch('/api/reconcile', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({deliveryId: $('delivery').value, receivedQuantity: qty,
      note: $('note').value, correctionReason: $('reason').value,
      confirmZero: $('zero').checked, layout: 'layout-a',
      simulateFailure: $('fail').checked})});
  $('result').textContent = JSON.stringify(await r.json(), null, 2);
  refresh();
};
async function refresh() {
  $('records').textContent = JSON.stringify(await (await fetch('/api/records')).json(), null, 2);
  $('queue').textContent = JSON.stringify(await (await fetch('/api/supervisor-queue')).json(), null, 2);
}
load();
</script>
</body></html>
